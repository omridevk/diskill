name: release

on:
  push:
    tags: ["disk-clean--v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build universal binary
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches plugin.json version
        run: |
          tag_version="${GITHUB_REF_NAME#disk-clean--v}"
          plugin_version=$(jq -r .version plugins/disk-clean/.claude-plugin/plugin.json)
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $plugin_version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: install Socket Firewall
        env:
          SFW_ASSET: sfw-free-macos-arm64
          SFW_SHA256: 1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw" | shasum -a 256 -c
          chmod 755 "$dir/sfw"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        working-directory: plugins/disk-clean/cli
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        working-directory: plugins/disk-clean/cli
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - name: build both architectures
        working-directory: plugins/disk-clean/cli
        run: |
          cargo build --release --frozen --target aarch64-apple-darwin
          cargo build --release --frozen --target x86_64-apple-darwin
      - name: package universal binary
        run: |
          target=plugins/disk-clean/cli/target
          mkdir -p dist
          lipo -create -output dist/disk-clean \
            "$target/aarch64-apple-darwin/release/disk-clean" \
            "$target/x86_64-apple-darwin/release/disk-clean"
          chmod 755 dist/disk-clean
          lipo -info dist/disk-clean
          tar -czf dist/disk-clean-macos-universal.tar.gz -C dist disk-clean
          cd dist
          shasum -a 256 disk-clean-macos-universal.tar.gz > disk-clean-macos-universal.tar.gz.sha256
          cat disk-clean-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-clean-macos-universal
          path: |
            dist/disk-clean-macos-universal.tar.gz
            dist/disk-clean-macos-universal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: build ${{ matrix.asset }} binary
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            sfw: sfw-free-linux-x86_64
            sfw-sha256: cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670
          - asset: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            sfw: sfw-free-linux-arm64
            sfw-sha256: c8c80aa582829f24f5d633f2c3f2ccd0b070bbee80bf3b956e5e2a9880184e20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}
      - name: install Socket Firewall
        env:
          SFW_ASSET: ${{ matrix.sfw }}
          SFW_SHA256: ${{ matrix.sfw-sha256 }}
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw" | sha256sum -c
          chmod 755 "$dir/sfw"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        working-directory: plugins/disk-clean/cli
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        working-directory: plugins/disk-clean/cli
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - name: build static binary
        working-directory: plugins/disk-clean/cli
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --frozen --target "$TARGET"
      - name: binary is statically linked
        env:
          TARGET: ${{ matrix.target }}
        run: |
          info=$(file "plugins/disk-clean/cli/target/$TARGET/release/disk-clean")
          echo "$info"
          case "$info" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *)
              echo "::error::disk-clean for $TARGET is not statically linked"
              exit 1
              ;;
          esac
      - name: package binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: disk-clean-${{ matrix.asset }}.tar.gz
        run: |
          mkdir -p dist
          cp "plugins/disk-clean/cli/target/$TARGET/release/disk-clean" dist/disk-clean
          chmod 755 dist/disk-clean
          tar -czf "dist/$ASSET" -C dist disk-clean
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-clean-${{ matrix.asset }}
          path: |
            dist/disk-clean-${{ matrix.asset }}.tar.gz
            dist/disk-clean-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows-x86_64:
    name: build windows-x86_64 binary
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ASSET: disk-clean-windows-x86_64.zip
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          targets: x86_64-pc-windows-msvc
      - name: install Socket Firewall
        env:
          SFW_ASSET: sfw-free-windows-x86_64.exe
          SFW_SHA256: f8c94fc5e41d49c51d2fd013c2c169274df9c483fc763d8c82ff71c5579d3bb0
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw.exe" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw.exe" | sha256sum -c
          chmod 755 "$dir/sfw.exe"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        working-directory: plugins/disk-clean/cli
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        working-directory: plugins/disk-clean/cli
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - name: build binary with the static C runtime
        working-directory: plugins/disk-clean/cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --frozen --target "$TARGET"
      - name: binary does not import the C runtime DLLs
        run: |
          if grep -aqiE 'vcruntime140|api-ms-win-crt-' "plugins/disk-clean/cli/target/$TARGET/release/disk-clean.exe"; then
            echo "::error::disk-clean for $TARGET imports the dynamic C runtime"
            exit 1
          fi
      - name: package binary
        run: |
          mkdir -p dist
          cp "plugins/disk-clean/cli/target/$TARGET/release/disk-clean.exe" dist/disk-clean.exe
          powershell -NoProfile -Command "Compress-Archive -LiteralPath dist/disk-clean.exe -DestinationPath dist/$ASSET"
          cd dist
          printf '%s  %s\n' "$(sha256sum "$ASSET" | cut -c1-64)" "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-clean-windows-x86_64
          path: |
            dist/disk-clean-windows-x86_64.zip
            dist/disk-clean-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows-arm64:
    name: build windows-arm64 binary
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ASSET: disk-clean-windows-arm64.zip
      TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          targets: aarch64-pc-windows-msvc
      - name: install Socket Firewall
        env:
          SFW_ASSET: sfw-free-windows-arm64.exe
          SFW_SHA256: 16607f9c64055b8e0af918dc93a72a342ca8352f46e6e3f810d1a378a380a82a
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw.exe" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw.exe" | sha256sum -c
          chmod 755 "$dir/sfw.exe"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        working-directory: plugins/disk-clean/cli
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        working-directory: plugins/disk-clean/cli
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - name: build binary with the static C runtime
        working-directory: plugins/disk-clean/cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --frozen --target "$TARGET"
      - name: binary does not import the C runtime DLLs
        run: |
          if grep -aqiE 'vcruntime140|api-ms-win-crt-' "plugins/disk-clean/cli/target/$TARGET/release/disk-clean.exe"; then
            echo "::error::disk-clean for $TARGET imports the dynamic C runtime"
            exit 1
          fi
      - name: package binary
        run: |
          mkdir -p dist
          cp "plugins/disk-clean/cli/target/$TARGET/release/disk-clean.exe" dist/disk-clean.exe
          powershell -NoProfile -Command "Compress-Archive -LiteralPath dist/disk-clean.exe -DestinationPath dist/$ASSET"
          cd dist
          printf '%s  %s\n' "$(sha256sum "$ASSET" | cut -c1-64)" "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disk-clean-windows-arm64
          path: |
            dist/disk-clean-windows-arm64.zip
            dist/disk-clean-windows-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and publish release
    needs: [build, build-linux, build-windows-x86_64, build-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
      id-token: write # sigstore signing for the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: disk-clean-*
          merge-multiple: true
          path: dist
      - name: checksums match the built archives
        working-directory: dist
        run: |
          shasum -a 256 -c \
            disk-clean-macos-universal.tar.gz.sha256 \
            disk-clean-linux-x86_64.tar.gz.sha256 \
            disk-clean-linux-arm64.tar.gz.sha256 \
            disk-clean-windows-x86_64.zip.sha256 \
            disk-clean-windows-arm64.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/disk-clean-macos-universal.tar.gz
            dist/disk-clean-linux-x86_64.tar.gz
            dist/disk-clean-linux-arm64.tar.gz
            dist/disk-clean-windows-x86_64.zip
            dist/disk-clean-windows-arm64.zip
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/disk-clean-macos-universal.tar.gz \
            dist/disk-clean-macos-universal.tar.gz.sha256 \
            dist/disk-clean-linux-x86_64.tar.gz \
            dist/disk-clean-linux-x86_64.tar.gz.sha256 \
            dist/disk-clean-linux-arm64.tar.gz \
            dist/disk-clean-linux-arm64.tar.gz.sha256 \
            dist/disk-clean-windows-x86_64.zip \
            dist/disk-clean-windows-x86_64.zip.sha256 \
            dist/disk-clean-windows-arm64.zip \
            dist/disk-clean-windows-arm64.zip.sha256 \
            --title "disk-clean v${GITHUB_REF_NAME#disk-clean--v}" \
            --generate-notes
