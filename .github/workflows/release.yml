name: release

on:
  push:
    tags: ["clean-disk--v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build universal binary
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches plugin.json version
        run: |
          tag_version="${GITHUB_REF_NAME#clean-disk--v}"
          plugin_version=$(jq -r .version plugins/clean-disk/.claude-plugin/plugin.json)
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $plugin_version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          use-cache: "false"
      - name: fetch crates through Socket Firewall
        working-directory: plugins/clean-disk/cli
        run: sfw cargo fetch --locked
      - name: build both architectures
        working-directory: plugins/clean-disk/cli
        run: |
          cargo build --release --frozen --target aarch64-apple-darwin
          cargo build --release --frozen --target x86_64-apple-darwin
      - name: package universal binary
        run: |
          target=plugins/clean-disk/cli/target
          mkdir -p dist
          lipo -create -output dist/clean-disk \
            "$target/aarch64-apple-darwin/release/clean-disk" \
            "$target/x86_64-apple-darwin/release/clean-disk"
          chmod 755 dist/clean-disk
          lipo -info dist/clean-disk
          tar -czf dist/clean-disk-macos-universal.tar.gz -C dist clean-disk
          cd dist
          shasum -a 256 clean-disk-macos-universal.tar.gz > clean-disk-macos-universal.tar.gz.sha256
          cat clean-disk-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-disk-release
          path: |
            dist/clean-disk-macos-universal.tar.gz
            dist/clean-disk-macos-universal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
      id-token: write # sigstore signing for the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clean-disk-release
          path: dist
      - name: checksum matches the built archive
        working-directory: dist
        run: shasum -a 256 -c clean-disk-macos-universal.tar.gz.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/clean-disk-macos-universal.tar.gz
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clean-disk-macos-universal.tar.gz \
            dist/clean-disk-macos-universal.tar.gz.sha256 \
            --title "clean-disk v${GITHUB_REF_NAME#clean-disk--v}" \
            --generate-notes
