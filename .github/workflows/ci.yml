name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  disk-clean:
    name: disk-clean cli
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - name: install Socket Firewall
        env:
          SFW_ASSET: sfw-free-macos-arm64
          SFW_SHA256: 1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw" | shasum -a 256 -c
          chmod 755 "$dir/sfw"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - run: cargo fmt --check
      - run: cargo clippy --frozen --all-targets -- -D warnings
      - run: cargo test --frozen
      - name: shellcheck run.sh
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck ../skills/disk-clean/scripts/run.sh
      - name: manifests are valid JSON
        working-directory: .
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/disk-clean/.claude-plugin/plugin.json

  disk-clean-linux:
    name: disk-clean cli (Linux, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            sfw: sfw-free-linux-x86_64
            sfw-sha256: cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            sfw: sfw-free-linux-arm64
            sfw-sha256: c8c80aa582829f24f5d633f2c3f2ccd0b070bbee80bf3b956e5e2a9880184e20
    defaults:
      run:
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: install Socket Firewall
        env:
          SFW_ASSET: ${{ matrix.sfw }}
          SFW_SHA256: ${{ matrix.sfw-sha256 }}
        run: |
          dir="$RUNNER_TEMP/sfw"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/sfw" \
            "https://github.com/SocketDev/sfw-free/releases/download/v1.15.4/$SFW_ASSET"
          echo "$SFW_SHA256  $dir/sfw" | sha256sum -c
          chmod 755 "$dir/sfw"
          echo "$dir" >> "$GITHUB_PATH"
          echo "SFW_JSON_REPORT_PATH=$RUNNER_TEMP/sfw-report.json" >> "$GITHUB_ENV"
      - name: fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - run: cargo fmt --check
      - run: cargo clippy --frozen --all-targets -- -D warnings
      - run: cargo clippy --frozen --all-targets --target "$TARGET" -- -D warnings
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo test --frozen --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  review-page:
    name: disk-clean review page
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: enable pnpm through corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter disk-clean-review exec playwright install chromium-headless-shell firefox
      - name: app tests (Chromium and Firefox)
        run: pnpm --filter disk-clean-review exec vitest run --project 'app *'
      - run: pnpm --filter disk-clean-review run build
      - name: committed page.html matches the source
        run: git diff --exit-code plugins/disk-clean/cli/assets/page.html
