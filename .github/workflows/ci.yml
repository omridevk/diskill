name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  disk-clean:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: shellcheck run.sh
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck ../skills/disk-clean/scripts/run.sh
      - name: manifests are valid JSON
        working-directory: .
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/disk-clean/.claude-plugin/plugin.json

  review-page:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter disk-clean-review exec playwright install chromium-headless-shell
      - run: pnpm --filter disk-clean-review test
      - run: pnpm --filter disk-clean-review run build
      - name: committed page.html matches the source
        run: git diff --exit-code plugins/disk-clean/cli/assets/page.html
