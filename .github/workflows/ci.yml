name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  disk-clean:
    name: disk-clean cli
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - run: cargo fmt --check
      - run: cargo clippy --frozen --all-targets -- -D warnings
      - run: cargo test --frozen
      - name: shellcheck run.sh
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck ../skills/disk-clean/scripts/run.sh
      - name: manifests are valid JSON
        working-directory: .
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/disk-clean/.claude-plugin/plugin.json

  disk-clean-linux:
    name: disk-clean cli (Linux, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    defaults:
      run:
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - run: cargo fmt --check
      - run: cargo clippy --frozen --all-targets -- -D warnings
      - run: cargo clippy --frozen --all-targets --target "$TARGET" -- -D warnings
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo test --frozen --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

  disk-clean-windows:
    name: disk-clean cli (Windows, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
        working-directory: plugins/disk-clean/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Socket Firewall report
        if: ${{ !cancelled() }}
        run: |
          crates=$(grep -c '^name = ' Cargo.lock)
          blocked=$(jq '.blocked // [] | length' "$SFW_JSON_REPORT_PATH")
          unparsed=$(jq '.parseFail // [] | length' "$SFW_JSON_REPORT_PATH")
          {
            echo "### Socket Firewall"
            echo "$crates crates in Cargo.lock fetched through sfw: $blocked blocked, $unparsed unparsed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq . "$SFW_JSON_REPORT_PATH"
          [ "$blocked" = 0 ] && [ "$unparsed" = 0 ]
      - run: cargo fmt --check
      - run: cargo clippy --frozen --all-targets -- -D warnings
      - run: cargo test --frozen

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  review-page:
    name: disk-clean review page
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: enable pnpm through corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter disk-clean-review exec playwright install chromium-headless-shell firefox
      - name: app tests (Chromium and Firefox)
        run: pnpm --filter disk-clean-review exec vitest run --project 'app *'
      - run: pnpm --filter disk-clean-review run build
      - name: committed page.html matches the source
        run: git diff --exit-code plugins/disk-clean/cli/assets/page.html
