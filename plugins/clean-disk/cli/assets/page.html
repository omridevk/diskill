<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Cleanup</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #ffffff; --panel-2: #fbfbfa; --ink: #17171a; --muted: #6f6f78;
  --line: #e4e4df; --accent: #1f6feb; --accent-ink: #ffffff; --accent-soft: #e8f0fe;
  --safe: #2f8f4e; --warn: #b45309; --report: #6f6f78; --danger: #c02b2b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316; --panel: #1c1c21; --panel-2: #212128; --ink: #ececed; --muted: #9c9ca6;
    --line: #2d2d35; --accent: #4c8dff; --accent-ink: #0a0a0c; --accent-soft: #1c2a45;
    --safe: #57c07d; --warn: #e0a15a; --report: #9c9ca6; --danger: #ef6b6b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  padding-bottom: 128px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 940px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }

header {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line);
}
.head-top { padding: 18px 24px 12px; display: flex; align-items: flex-end; gap: 20px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.headline { margin-left: auto; text-align: right; }
.headline .big { font-size: 30px; font-weight: 650; letter-spacing: -.025em; line-height: 1.1; }
.headline .cap { color: var(--muted); font-size: 12px; }

.diskbar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 0 24px; }
.diskbar i { display: block; height: 100%; transition: width .25s ease; }
.seg-used { background: color-mix(in srgb, var(--ink) 34%, transparent); }
.seg-sel { background: var(--accent); }
.seg-free { background: color-mix(in srgb, var(--safe) 45%, transparent); }
.legend { display: flex; gap: 16px; padding: 8px 24px 0; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }

.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 24px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 190px; }
.search input {
  width: 100%; font: inherit; padding: 7px 30px 7px 30px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
.search .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; }
select {
  font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
}
.chips { display: flex; gap: 6px; }
.chip {
  font-size: 12px; padding: 6px 11px; border-radius: 999px; cursor: pointer; user-select: none;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); white-space: nowrap;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip .n { opacity: .6; margin-left: 4px; }

.actions { display: flex; gap: 6px; padding: 0 24px 12px; flex-wrap: wrap; align-items: center; }
.link {
  font-size: 12.5px; padding: 5px 10px; border-radius: 7px; cursor: pointer; border: 1px solid transparent;
  background: transparent; color: var(--accent); font-weight: 550;
}
.link:hover { background: var(--accent-soft); }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }

main { padding: 18px 24px 0; }
.cat {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden;
}
.cat.sel-partial { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.cat-head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
.cat-head:hover { background: var(--panel-2); }
.cat-name { font-weight: 620; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cat-desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.grow { flex: 1; min-width: 0; }
.meter { height: 3px; border-radius: 999px; background: var(--line); margin-top: 7px; max-width: 320px; }
.meter i { display: block; height: 100%; border-radius: 999px; background: color-mix(in srgb, var(--accent) 70%, transparent); }
.size { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 560; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tag {
  font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor;
}
.tag.safe { color: var(--safe); }
.tag.review { color: var(--warn); }
.tag.report { color: var(--report); }
.chev { color: var(--muted); transition: transform .18s ease; font-size: 11px; }
.cat.open .chev { transform: rotate(90deg); }
.items { display: none; border-top: 1px solid var(--line); background: var(--panel-2); }
.cat.open .items { display: block; }
.item { display: flex; align-items: center; gap: 12px; padding: 9px 16px 9px 44px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.item.on { box-shadow: inset 3px 0 0 var(--accent); }
.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.path mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.note { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); flex: none; cursor: pointer; }
input[type=checkbox]:disabled { cursor: not-allowed; opacity: .35; }

.banner {
  display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; margin-bottom: 10px;
}
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }

.tabs { display: flex; gap: 4px; padding: 0 24px; }
.tab {
  font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px 8px 0 0; cursor: pointer;
  color: var(--muted); border: 1px solid transparent; border-bottom: none; background: transparent;
}
.tab.on { color: var(--ink); background: var(--panel); border-color: var(--line); }
.tab .n { font-weight: 400; opacity: .65; margin-left: 5px; }

.recon { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
         padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.recon h3 { margin: 0 0 12px; font-size: 14px; }
.rrow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rrow:last-child { border-bottom: 0; }
.rrow .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.rrow .rname { flex: 1; }
.rrow .rpct { color: var(--muted); font-size: 12px; width: 52px; text-align: right; }
.rrow.total { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; margin-top: 4px; padding-top: 10px; }

.tree { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); overflow: hidden; }
.tnode { border-bottom: 1px solid var(--line); }
.tnode:last-child { border-bottom: 0; }
.trow { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; }
.trow:hover { background: var(--panel-2); }
.trow.leaf { cursor: default; }
.tcaret { width: 12px; color: var(--muted); font-size: 10px; flex: none; transition: transform .15s ease; }
.tnode.open > .trow .tcaret { transform: rotate(90deg); }
.tname { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.tname.rest { font-family: inherit; color: var(--muted); font-style: italic; }
.tbar { flex: 1; height: 6px; border-radius: 999px; background: var(--line); min-width: 60px; max-width: 340px; }
.tbar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.tkids { display: none; }
.tnode.open > .tkids { display: block; }
.tkids .trow { padding-left: 30px; }
.tkids .tkids .trow { padding-left: 48px; }
.tkids .tkids .tkids .trow { padding-left: 66px; }
.quick { display: flex; gap: 6px; align-items: center; padding: 8px 16px 8px 44px;
         border-bottom: 1px solid var(--line); background: var(--panel);
         font-size: 12px; color: var(--muted); position: sticky; top: 0; }
.quick button { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px;
                border: 1px solid var(--line); background: var(--panel-2); color: var(--accent); cursor: pointer; }
.age { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
       border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.age.old { color: var(--warn); border-color: currentColor; }
.approx { color: var(--muted); font-weight: 400; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
         padding: 2px 6px; border-radius: 999px; color: var(--safe); border: 1px solid currentColor; }

.burst {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: center;
}
@media (max-width: 760px) { .burst { grid-template-columns: 1fr; } }
.burst svg { width: 100%; height: auto; display: block; max-height: 62vh; }
.burst path { cursor: pointer; transition: opacity .12s ease, filter .12s ease; }
.burst path.dim { opacity: .28; }
.burst path.hot { filter: brightness(1.18); }
.burst path.leafseg { cursor: default; }
.burst text { pointer-events: none; font-size: 9.5px; font-weight: 600; fill: #fff;
              paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 2.6px; }
.burst .hub text { stroke: none; fill: var(--ink); }
.burst .hub text.hub-hint { fill: var(--muted); }
.hub { cursor: pointer; }
.hub-name { font-size: 13px; font-weight: 700; fill: var(--ink); stroke: none; }
.hub-size { font-size: 17px; font-weight: 700; fill: var(--ink); stroke: none; }
.hub-hint { font-size: 9.5px; fill: var(--muted); stroke: none; }

.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 10px; font-size: 12.5px; }
.crumb { cursor: pointer; color: var(--accent); font-weight: 600; padding: 2px 6px; border-radius: 6px; }
.crumb:hover { background: var(--accent-soft); }
.crumb.last { color: var(--ink); cursor: default; }
.crumb.last:hover { background: transparent; }
.crumbs .sl { color: var(--muted); }

.inspect { border-left: 1px solid var(--line); padding-left: 20px; min-height: 210px; }
@media (max-width: 760px) { .inspect { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; } }
.inspect .ipath { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
                  overflow-wrap: anywhere; color: var(--muted); margin-bottom: 10px; min-height: 30px; }
.inspect .isize { font-size: 26px; font-weight: 680; letter-spacing: -.02em; }
.inspect .imeta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.inspect .ikids { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.inspect .ikid { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0; }
.inspect .ikid .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.inspect .ikid .kn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 13px 24px; box-shadow: 0 -4px 28px rgba(0,0,0,.09);
}
.bar { display: flex; align-items: center; gap: 14px; }
.foot-num { font-size: 15px; font-weight: 620; }
.foot-sub { color: var(--muted); font-size: 12px; }
button {
  font: inherit; font-size: 13.5px; font-weight: 620; border-radius: 8px; padding: 9px 17px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button.confirm { background: var(--danger); color: #fff; border-color: transparent; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:not(:disabled):hover { filter: brightness(1.07); }
.done { text-align: center; padding: 110px 24px; }
.done h2 { font-size: 23px; margin: 0 0 10px; letter-spacing: -.02em; }
.hidden { display: none !important; }
kbd {
  font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; color: var(--muted); background: var(--panel);
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="wrap head-top">
    <div>
      <h1>Disk Cleanup</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="headline">
      <div class="big num" id="total">0 B</div>
      <div class="cap" id="totalsub">selected to free</div>
    </div>
  </div>
  <div class="wrap">
    <div class="diskbar">
      <i class="seg-used" id="segUsed"></i><i class="seg-sel" id="segSel"></i><i class="seg-free" id="segFree"></i>
    </div>
    <div class="legend">
      <span><i class="dot seg-used"></i> used after <b class="num" id="legUsed"></b></span>
      <span><i class="dot seg-sel"></i> selected <b class="num" id="legSel"></b></span>
      <span><i class="dot seg-free"></i> free after <b class="num" id="legFree"></b></span>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="clean">Cleanup<span class="n" id="tabCleanN"></span></button>
      <button class="tab" data-tab="map">Storage map<span class="n" id="tabMapN"></span></button>
    </div>
  </div>
  <div class="wrap" id="cleanTools">
    <div class="toolbar">
      <label class="search">
        <span class="ico">&#9906;</span>
        <input id="q" type="search" placeholder="Filter by path, name or category" autocomplete="off">
        <span class="kbd" id="qhint">/</span>
      </label>
      <select id="sort" title="Sort">
        <option value="size-desc">Largest first</option>
        <option value="size-asc">Smallest first</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="age-desc">Oldest first</option>
        <option value="age-asc">Newest first</option>
        <option value="count-desc">Most items</option>
      </select>
      <select id="age" title="Minimum age">
        <option value="-1">Any age</option>
        <option value="30">Untouched 30+ days</option>
        <option value="90">Untouched 90+ days</option>
        <option value="180">Untouched 180+ days</option>
        <option value="365">Untouched 1+ year</option>
      </select>
      <select id="min" title="Minimum size">
        <option value="0">Any size</option>
        <option value="52428800">&#8805; 50 MB</option>
        <option value="104857600">&#8805; 100 MB</option>
        <option value="524288000">&#8805; 500 MB</option>
        <option value="1073741824">&#8805; 1 GB</option>
      </select>
      <div class="chips" id="chips"></div>
    </div>
    <div class="actions">
      <button class="link" data-act="all">Select all shown</button>
      <button class="link" data-act="none">Deselect all</button>
      <button class="link" data-act="reset">Reset to recommended</button>
      <span class="sep"></span>
      <button class="link" data-act="expand">Expand all</button>
      <button class="link" data-act="collapse">Collapse all</button>
      <span class="sep"></span>
      <button class="link" data-act="onlysel" id="onlysel">Show only selected</button>
      <span class="grow"></span>
      <span class="foot-sub">shortcuts <kbd>/</kbd> <kbd>a</kbd> <kbd>d</kbd> <kbd>r</kbd> <kbd>e</kbd> <kbd>c</kbd></span>
    </div>
  </div>
</header>
<main><div class="wrap">
  <div id="viewClean">
    <div id="banners"></div>
    <div id="cats"></div>
  </div>
  <div id="viewMap" class="hidden">
    <div class="crumbs" id="crumbs"></div>
    <div class="burst">
      <div id="burstBox"></div>
      <div class="inspect" id="inspect"></div>
    </div>
    <div class="recon" id="recon"></div>
    <div class="banner">Read-only view of where space actually sits. Folders at least 200 MB, three levels deep. Nothing here can be deleted from this screen — switch to Cleanup for that.</div>
    <div class="tree" id="tree"></div>
  </div>
</div></main>
<footer><div class="wrap bar">
  <div class="grow">
    <div class="foot-num num" id="selcount"></div>
    <div class="foot-sub" id="foothint"></div>
  </div>
  <button id="cancel">Cancel</button>
  <button id="approve" class="primary">Approve and delete</button>
</div></footer>
</div>
<div id="done" class="done hidden">
  <h2 id="donetitle"></h2>
  <div class="sub" id="donebody"></div>
</div>
<script>
const DATA = __DATA__;
const TOKEN = "__TOKEN__";

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function fmt(n) {
  if (n < 1024) return Math.round(n) + " B";
  const u = ["KB", "MB", "GB", "TB"];
  let i = -1, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + " " + u[i];
}
function mark(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const at = safe.toLowerCase().indexOf(esc(q).toLowerCase());
  if (at < 0) return safe;
  return safe.slice(0, at) + "<mark>" + safe.slice(at, at + q.length) + "</mark>" + safe.slice(at + q.length);
}

const ALL = [];
DATA.categories.forEach(c => c.items.forEach(it => {
  it.cat = c;
  ALL.push(it);
}));

const state = new Map(ALL.map(it => [it.path, it.preselect]));
const open = new Set();
const ui = { q: "", sort: "size-desc", min: 0, age: -1, risks: new Set(["safe", "review", "report"]), onlySel: false };
const EXACT = it => it.accuracy === "exact";
const sumExact = list => list.filter(EXACT).reduce((a, b) => a + b.bytes, 0);
const sumOther = list => list.filter(it => !EXACT(it)).reduce((a, b) => a + b.bytes, 0);
let armed = false;

const riskCounts = { safe: 0, review: 0, report: 0 };
DATA.categories.forEach(c => { riskCounts[c.risk] = (riskCounts[c.risk] || 0) + c.items.length; });

function matches(it) {
  if (!ui.risks.has(it.cat.risk)) return false;
  if (it.bytes < ui.min) return false;
  if (ui.age >= 0 && !(it.age >= ui.age)) return false;
  if (ui.onlySel && !state.get(it.path)) return false;
  if (ui.q) {
    const hay = (it.label + " " + it.path + " " + it.cat.title + " " + it.note).toLowerCase();
    if (!hay.includes(ui.q.toLowerCase())) return false;
  }
  return true;
}
function sortItems(list) {
  const s = ui.sort;
  return list.slice().sort((a, b) =>
    s === "size-asc" ? a.bytes - b.bytes :
    s === "name-asc" ? a.label.localeCompare(b.label) :
    s === "name-desc" ? b.label.localeCompare(a.label) :
    s === "age-desc" ? (b.age ?? -1) - (a.age ?? -1) :
    s === "age-asc" ? (a.age ?? 1e9) - (b.age ?? 1e9) :
    b.bytes - a.bytes);
}
function view() {
  const out = [];
  DATA.categories.forEach(c => {
    const items = sortItems(c.items.filter(matches));
    if (items.length) out.push({ cat: c, items, bytes: items.reduce((a, b) => a + b.bytes, 0) });
  });
  const s = ui.sort;
  out.sort((a, b) => {
    if (a.cat.risk === "report" !== (b.cat.risk === "report")) return a.cat.risk === "report" ? 1 : -1;
    return s === "size-asc" ? a.bytes - b.bytes :
           s === "name-asc" ? a.cat.title.localeCompare(b.cat.title) :
           s === "name-desc" ? b.cat.title.localeCompare(a.cat.title) :
           s === "count-desc" ? b.items.length - a.items.length :
           b.bytes - a.bytes;
  });
  return out;
}
function selected() { return ALL.filter(it => state.get(it.path)); }

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = ["safe", "review", "report"].filter(r => riskCounts[r]).map(r =>
    `<span class="chip ${ui.risks.has(r) ? "on" : ""}" data-risk="${r}">${r === "report" ? "report only" : r}<span class="n">${riskCounts[r]}</span></span>`
  ).join("");
  box.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => {
    const r = el.dataset.risk;
    ui.risks.has(r) ? ui.risks.delete(r) : ui.risks.add(r);
    render();
  }));
}

function render() {
  const groups = view();
  const maxBytes = Math.max(1, ...groups.map(g => g.bytes));
  const root = document.getElementById("cats");
  root.innerHTML = "";

  groups.forEach(g => {
    const c = g.cat;
    const pickable = g.items.filter(it => !it.report);
    const on = pickable.filter(it => state.get(it.path)).length;
    const el = document.createElement("section");
    el.className = "cat" + (open.has(c.id) ? " open" : "") + (on && on < pickable.length ? " sel-partial" : "");
    el.innerHTML = `
      <div class="cat-head">
        <input type="checkbox" ${on && on === pickable.length ? "checked" : ""} ${pickable.length ? "" : "disabled"}>
        <div class="grow">
          <div class="cat-name">${mark(c.title, ui.q)}<span class="tag ${c.risk}">${c.risk === "report" ? "report only" : c.risk}</span></div>
          <div class="cat-desc">${esc(c.desc)}</div>
          <div class="meter"><i style="width:${(g.bytes / maxBytes * 100).toFixed(1)}%"></i></div>
        </div>
        <div style="text-align:right">
          <div class="size num">${fmt(g.bytes)}</div>
          <div class="count">${g.items.length} of ${c.items.length} shown${on ? " &middot; " + on + " picked" : ""}</div>
        </div>
        <span class="chev">&#9656;</span>
      </div>
      <div class="items"></div>`;

    const box = el.querySelector(".cat-head input");
    box.indeterminate = on > 0 && on < pickable.length;
    box.addEventListener("click", e => {
      e.stopPropagation();
      const val = e.target.checked;
      pickable.forEach(it => state.set(it.path, val));
      open.add(c.id);
      render();
    });
    el.querySelector(".cat-head").addEventListener("click", () => {
      open.has(c.id) ? open.delete(c.id) : open.add(c.id);
      render();
    });

    const list = el.querySelector(".items");
    if (pickable.length > 3) {
      const hasAge = pickable.some(it => it.age !== null);
      const q = document.createElement("div");
      q.className = "quick";
      q.innerHTML = `<span>select in this section:</span>
        <button data-q="all">all ${pickable.length}</button>
        ${hasAge ? `<button data-q="stale">untouched 90+ days</button>` : ""}
        ${hasAge ? `<button data-q="year">untouched 1+ year</button>` : ""}
        <button data-q="none">none</button>`;
      q.querySelectorAll("button").forEach(b => b.addEventListener("click", ev => {
        ev.stopPropagation();
        const mode = b.dataset.q;
        pickable.forEach(it => state.set(it.path,
          mode === "all" ? true :
          mode === "none" ? false :
          mode === "stale" ? it.age >= 90 :
          it.age >= 365));
        render();
      }));
      list.appendChild(q);
    }
    g.items.forEach(it => {
      const row = document.createElement("div");
      const isOn = !!state.get(it.path);
      row.className = "item" + (isOn ? " on" : "");
      row.innerHTML = `
        <input type="checkbox" ${isOn ? "checked" : ""} ${it.report ? "disabled" : ""}>
        <div class="grow">
          <div class="path">${mark(it.label, ui.q)}</div>
          ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
        </div>
        ${it.age !== null ? `<span class="age ${it.age >= 90 ? "old" : ""}">${it.age}d</span>` : ""}
        <div class="size num">${EXACT(it) ? "" : "<span class=\"approx\">&#8776;</span> "}${fmt(it.bytes)}</div>`;
      row.querySelector("input").addEventListener("change", e => {
        state.set(it.path, e.target.checked);
        render();
      });
      list.appendChild(row);
    });
    root.appendChild(el);
  });

  if (!groups.length) {
    root.innerHTML = `<div class="empty">Nothing matches these filters.<br><button class="link" id="clearf">Clear filters</button></div>`;
    document.getElementById("clearf").addEventListener("click", () => {
      ui.q = ""; ui.min = 0; ui.onlySel = false;
      ui.risks = new Set(["safe", "review", "report"]);
      document.getElementById("q").value = "";
      document.getElementById("min").value = "0";
      renderChips(); render();
    });
  }

  const sel = selected();
  const total = sumExact(sel);
  const vmTotal = sumOther(sel);
  const shown = new Set(groups.flatMap(g => g.items.map(i => i.path)));
  const hidden = sel.filter(it => !shown.has(it.path));
  const risky = sel.filter(it => it.cat.risk === "review");

  const banners = [];
  if (hidden.length) banners.push(
    `<div class="banner warn"><b>${hidden.length}</b> selected item${hidden.length === 1 ? " is" : "s are"} hidden by the current filters (${fmt(hidden.reduce((a, b) => a + b.bytes, 0))}). They will still be deleted.</div>`);
  if (risky.length) banners.push(
    `<div class="banner warn"><b>${risky.length}</b> item${risky.length === 1 ? "" : "s"} marked <b>review</b> selected — these are slow or costly to rebuild.</div>`);
  document.getElementById("banners").innerHTML = banners.join("");

  document.getElementById("total").textContent = fmt(total);
  document.getElementById("totalsub").textContent = vmTotal
    ? "reclaimed on this Mac · plus " + fmt(vmTotal) + " apparent (Docker VM, pnpm clones), real reclaim lower"
    : "selected to free";
  document.getElementById("selcount").textContent =
    sel.length + " item" + (sel.length === 1 ? "" : "s") + " selected · " + fmt(total) +
    (vmTotal ? " on disk (+" + fmt(vmTotal) + " apparent)" : "");
  document.getElementById("foothint").textContent =
    groups.reduce((a, g) => a + g.items.length, 0) + " of " + ALL.length + " shown" +
    (risky.length ? " · confirmation required" : "");
  document.getElementById("approve").disabled = sel.length === 0;
  document.getElementById("onlysel").style.color = ui.onlySel ? "var(--ink)" : "";
  document.getElementById("onlysel").textContent = ui.onlySel ? "Showing only selected" : "Show only selected";

  const disk = DATA.total || 1;
  const freeAfter = DATA.free + total;
  const usedAfter = Math.max(0, disk - freeAfter);
  document.getElementById("segUsed").style.width = (usedAfter / disk * 100) + "%";
  document.getElementById("segSel").style.width = (total / disk * 100) + "%";
  document.getElementById("segFree").style.width = (DATA.free / disk * 100) + "%";
  document.getElementById("legUsed").textContent = fmt(usedAfter);
  document.getElementById("legSel").textContent = fmt(total);
  document.getElementById("legFree").textContent = fmt(freeAfter);

  if (armed) { armed = false; setApprove(false); }
}

function setApprove(arm) {
  const b = document.getElementById("approve");
  armed = arm;
  b.className = arm ? "confirm" : "primary";
  b.textContent = arm ? "Click again to confirm" : "Approve and delete";
}

document.getElementById("sub").textContent =
  fmt(DATA.reclaimable) + " reclaimable across " + ALL.filter(it => !it.report).length +
  " items · " + fmt(DATA.free) + " free now";

const qEl = document.getElementById("q");
qEl.addEventListener("input", e => { ui.q = e.target.value.trim(); render(); });
document.getElementById("sort").addEventListener("change", e => { ui.sort = e.target.value; render(); });
document.getElementById("min").addEventListener("change", e => { ui.min = +e.target.value; render(); });
document.getElementById("age").addEventListener("change", e => { ui.age = +e.target.value; render(); });

document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act)));

function act(name) {
  if (name === "all") view().forEach(g => g.items.forEach(it => { if (!it.report) state.set(it.path, true); }));
  if (name === "none") ALL.forEach(it => state.set(it.path, false));
  if (name === "reset") ALL.forEach(it => state.set(it.path, it.preselect));
  if (name === "expand") view().forEach(g => open.add(g.cat.id));
  if (name === "collapse") open.clear();
  if (name === "onlysel") ui.onlySel = !ui.onlySel;
  render();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if (e.key === "Escape") { e.target.blur(); if (e.target === qEl) { qEl.value = ""; ui.q = ""; render(); } }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { "/": null, a: "all", d: "none", r: "reset", e: "expand", c: "collapse" };
  if (!(e.key in map)) return;
  e.preventDefault();
  if (e.key === "/") qEl.focus(); else act(map[e.key]);
});

function finish(title, body) {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("done").classList.remove("hidden");
  document.getElementById("donetitle").textContent = title;
  document.getElementById("donebody").textContent = body;
}
function post(decision) {
  return fetch("/decide", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      token: TOKEN, decision,
      items: decision === "approve"
        ? selected().map(it => ({ path: it.path, category: it.cat.id })) : [],
    }),
  });
}

document.getElementById("approve").addEventListener("click", () => {
  const sel = selected();
  const risky = sel.filter(it => it.cat.risk === "review").length;
  if (risky && !armed) { setApprove(true); return; }
  const total = sel.reduce((a, b) => a + b.bytes, 0);
  post("approve").then(() =>
    finish("Approved — " + fmt(total) + " queued for deletion",
           "Deletion runs in the background. You can close this tab and return to the terminal."));
});
document.getElementById("cancel").addEventListener("click", () => {
  post("cancel").then(() => finish("Cancelled", "Nothing was deleted. You can close this tab."));
});

const cleanablePaths = new Set(ALL.filter(it => !it.report).map(it => it.path));
const openNodes = new Set(["~"]);

function renderRecon() {
  const d = DATA;
  const homeBytes = d.home || 0;
  const other = Math.max(0, d.used - homeBytes);
  const reserved = Math.max(0, d.total - d.used - d.free);
  const rows = [
    ["Your home folder", homeBytes, "var(--accent)",
     "everything under ~, broken down below"],
    ["Rest of the data volume", other, "color-mix(in srgb, var(--ink) 34%, transparent)",
     "/Applications, other users, /usr/local, system-wide caches"],
    ["macOS system volume and APFS reserve", reserved, "var(--warn)",
     "the sealed read-only system, Preboot, Recovery, swap and snapshots — not user-deletable"],
    ["Free right now", d.free, "color-mix(in srgb, var(--safe) 45%, transparent)", ""],
  ];
  const snap = d.snapshots
    ? `<div class="rrow"><span class="swatch" style="background:var(--warn)"></span>
         <span class="rname">${d.snapshots} local Time Machine snapshot${d.snapshots === 1 ? "" : "s"}
         <span class="foot-sub">counted inside the reserve row above; macOS purges these automatically when space runs low</span></span>
         <span class="size num">—</span><span class="rpct"></span></div>` : "";
  const overcount = homeBytes > d.used
    ? `<div class="foot-sub">du counts ${fmt(homeBytes - d.used)} more than the disk holds: APFS clones and snapshots share blocks</div>` : "";
  document.getElementById("recon").innerHTML = `
    <h3>Where your ${fmt(d.total)} went</h3>
    ${overcount}
    ${rows.map(([name, bytes, color, hint]) => `
      <div class="rrow">
        <span class="swatch" style="background:${color}"></span>
        <span class="rname">${name}${hint ? `<div class="foot-sub">${hint}</div>` : ""}</span>
        <span class="size num">${fmt(bytes)}</span>
        <span class="rpct num">${(bytes / d.total * 100).toFixed(1)}%</span>
      </div>`).join("")}
    ${snap}
    <div class="rrow total">
      <span class="swatch"></span><span class="rname">Total disk</span>
      <span class="size num">${fmt(d.total)}</span><span class="rpct num">100%</span>
    </div>`;
}

function nodeEl(node, parentBytes) {
  const el = document.createElement("div");
  const kids = node.children || [];
  const id = node.path;
  el.className = "tnode" + (openNodes.has(id) || openNodes.has("~") && node.name === "~" ? " open" : "");
  const pct = parentBytes ? node.bytes / parentBytes * 100 : 100;
  const cleanable = cleanablePaths.has(node.path);
  const row = document.createElement("div");
  row.className = "trow" + (kids.length ? "" : " leaf");
  row.innerHTML = `
    <span class="tcaret">${kids.length ? "&#9656;" : ""}</span>
    <span class="tname ${node.rest ? "rest" : ""}">${esc(node.name)}</span>
    ${cleanable ? '<span class="badge">cleanable</span>' : ""}
    <span class="tbar"><i style="width:${pct.toFixed(1)}%"></i></span>
    <span class="size num">${fmt(node.bytes)}</span>
    <span class="rpct num">${(node.bytes / DATA.total * 100).toFixed(1)}%</span>`;
  el.appendChild(row);
  if (kids.length) {
    const box = document.createElement("div");
    box.className = "tkids";
    kids.forEach(k => box.appendChild(nodeEl(k, node.bytes)));
    el.appendChild(box);
    row.addEventListener("click", () => {
      openNodes.has(id) ? openNodes.delete(id) : openNodes.add(id);
      el.classList.toggle("open");
    });
  }
  return el;
}

const parentOf = new Map();
(function indexTree(n) {
  (n.children || []).forEach(c => { parentOf.set(c, n); indexTree(c); });
})(DATA.tree || { children: [] });

let focus = DATA.tree;
let hover = null;

const HUES = [210, 28, 152, 340, 265, 46, 190, 120, 8, 300, 172, 65];
const TAU = Math.PI * 2;
const RINGS = 3, R_HUB = 74, R_MAX = 250, MIN_ARC = 0.006;

function tone(hue, depth, hot) {
  const light = [46, 53, 59][Math.min(depth - 1, 2)] + (hot ? 8 : 0);
  const sat = [58, 50, 44][Math.min(depth - 1, 2)];
  return `hsl(${hue} ${sat}% ${light}%)`;
}
function polar(r, a) { return [r * Math.cos(a - Math.PI / 2), r * Math.sin(a - Math.PI / 2)]; }
function arc(r0, r1, a0, a1) {
  const big = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = polar(r1, a0), [x1, y1] = polar(r1, a1);
  const [x2, y2] = polar(r0, a1), [x3, y3] = polar(r0, a0);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}` +
         `L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`;
}

function layout(node) {
  const segs = [];
  const ring = (R_MAX - R_HUB) / RINGS;
  (function walk(n, depth, a0, a1, hue) {
    if (depth > RINGS || a1 - a0 < MIN_ARC) return;
    if (depth > 0) segs.push({
      node: n, depth, a0, a1, hue,
      r0: R_HUB + (depth - 1) * ring, r1: R_HUB + depth * ring,
    });
    const kids = n.children || [];
    const sum = kids.reduce((a, k) => a + k.bytes, 0) || 1;
    let a = a0;
    kids.forEach((k, i) => {
      const span = (a1 - a0) * (k.bytes / sum) * Math.min(1, sum / n.bytes);
      walk(k, depth + 1, a, a + span, depth === 0 ? HUES[i % HUES.length] : hue);
      a += span;
    });
  })(node, 0, 0, TAU, HUES[0]);
  return segs;
}

function pathOf(node) {
  const chain = [];
  for (let n = node; n; n = parentOf.get(n)) chain.unshift(n);
  return chain;
}

function renderInspect(seg) {
  const n = seg ? seg.node : focus;
  const box = document.getElementById("inspect");
  const kids = (n.children || []).slice(0, 7);
  const sum = (n.children || []).reduce((a, k) => a + k.bytes, 0) || n.bytes;
  const cleanable = cleanablePaths.has(n.path);
  box.innerHTML = `
    <div class="ipath">${esc(n.path)}</div>
    <div class="isize num">${fmt(n.bytes)}</div>
    <div class="imeta">${(n.bytes / DATA.total * 100).toFixed(1)}% of the disk
      ${n !== focus ? " · " + (n.bytes / focus.bytes * 100).toFixed(1) + "% of " + esc(focus.name) : ""}</div>
    ${cleanable ? '<div style="margin-top:8px"><span class="badge">cleanable</span></div>' : ""}
    ${kids.length ? `<div class="ikids">${kids.map((k, i) => `
      <div class="ikid">
        <span class="sw" style="background:${tone(seg ? seg.hue : HUES[i % HUES.length], seg ? seg.depth + 1 : 1, false)}"></span>
        <span class="kn">${esc(k.name)}</span>
        <span class="num">${fmt(k.bytes)}</span>
        <span class="rpct num">${(k.bytes / sum * 100).toFixed(0)}%</span>
      </div>`).join("")}</div>` : ""}`;
}

function renderCrumbs() {
  const chain = pathOf(focus);
  document.getElementById("crumbs").innerHTML = chain.map((n, i) =>
    `<span class="crumb ${i === chain.length - 1 ? "last" : ""}" data-i="${i}">${esc(n.name)}</span>` +
    (i < chain.length - 1 ? '<span class="sl">/</span>' : "")).join("");
  document.querySelectorAll("#crumbs .crumb").forEach(el => el.addEventListener("click", () => {
    const target = pathOf(focus)[+el.dataset.i];
    if (target && target !== focus) { focus = target; renderBurst(); }
  }));
}

function renderBurst() {
  renderCrumbs();
  const segs = layout(focus);
  const up = parentOf.get(focus);
  const svg = [`<svg viewBox="-260 -260 520 520" role="img" aria-label="Storage sunburst">`];

  segs.forEach((s, i) => {
    const leaf = !(s.node.children || []).length;
    svg.push(`<path d="${arc(s.r0, s.r1, s.a0, s.a1)}" fill="${tone(s.hue, s.depth, false)}"
      stroke="var(--panel)" stroke-width="1" data-i="${i}" class="${leaf ? "leafseg" : ""}"></path>`);
    if (cleanablePaths.has(s.node.path))
      svg.push(`<path d="${arc(s.r0 + 1.5, s.r1 - 1.5, s.a0, s.a1)}" fill="none"
        stroke="rgba(255,255,255,.85)" stroke-width="1.4" stroke-dasharray="3 3" pointer-events="none"></path>`);
  });

  segs.forEach(s => {
    const span = s.a1 - s.a0;
    const midR = (s.r0 + s.r1) / 2;
    if (s.depth > 2 || span * midR < 14) return;
    const mid = (s.a0 + s.a1) / 2;
    const [x, y] = polar(midR, mid);
    let deg = (mid * 180 / Math.PI) - 90;
    if (deg > 90 || deg < -90) deg += 180;
    const room = Math.floor((s.r1 - s.r0 - 10) / 5.4);
    if (room < 4) return;
    const name = s.node.name.length > room ? s.node.name.slice(0, room - 1) + "…" : s.node.name;
    svg.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" transform="rotate(${deg.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"
      text-anchor="middle" dominant-baseline="central">${esc(name)}</text>`);
  });

  svg.push(`<g class="hub"><circle r="${R_HUB - 4}" fill="var(--panel-2)" stroke="var(--line)"></circle>
    <text class="hub-name" text-anchor="middle" y="-16">${esc(focus.name.length > 16 ? focus.name.slice(0, 15) + "…" : focus.name)}</text>
    <text class="hub-size num" text-anchor="middle" y="8">${fmt(focus.bytes)}</text>
    <text class="hub-hint" text-anchor="middle" y="28">${up ? "click to go up" : "click a ring to zoom"}</text></g>`);
  svg.push(`</svg>`);

  const box = document.getElementById("burstBox");
  box.innerHTML = svg.join("");
  renderInspect(null);

  box.querySelectorAll("path[data-i]").forEach(el => {
    const s = segs[+el.dataset.i];
    el.addEventListener("mouseenter", () => {
      hover = s;
      box.querySelectorAll("path[data-i]").forEach(o => {
        const os = segs[+o.dataset.i];
        const related = pathOf(os.node).includes(s.node) || pathOf(s.node).includes(os.node);
        o.classList.toggle("dim", !related);
        o.classList.toggle("hot", os === s);
      });
      renderInspect(s);
    });
    el.addEventListener("click", () => {
      if (!(s.node.children || []).length) return;
      focus = s.node;
      renderBurst();
    });
  });
  box.onmouseleave = () => {
    hover = null;
    box.querySelectorAll("path[data-i]").forEach(o => o.classList.remove("dim", "hot"));
    renderInspect(null);
  };
  const hub = box.querySelector(".hub");
  if (hub) hub.addEventListener("click", () => {
    if (up) { focus = up; renderBurst(); }
  });
}

function renderMap() {
  renderRecon();
  if (DATA.tree) renderBurst();
  const box = document.getElementById("tree");
  box.innerHTML = "";
  if (!DATA.tree) {
    box.innerHTML = '<div class="empty">No storage map in this run. Re-run the scan to build one.</div>';
    return;
  }
  openNodes.add(DATA.tree.path);
  box.appendChild(nodeEl(DATA.tree, DATA.tree.bytes));
}

let tab = "clean";
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  document.getElementById("viewClean").classList.toggle("hidden", tab !== "clean");
  document.getElementById("viewMap").classList.toggle("hidden", tab !== "map");
  document.getElementById("cleanTools").classList.toggle("hidden", tab !== "clean");
  if (tab === "map") renderMap();
}));
document.getElementById("tabCleanN").textContent = ALL.length;
document.getElementById("tabMapN").textContent = DATA.tree ? fmt(DATA.tree.bytes) : (DATA.home ? fmt(DATA.home) : "");

renderChips();
render();
</script>
</body>
</html>
